spring:
  application:
    name: mybatis-sns
  config:
    import: optional:application-oauth.yaml

  # 데이터베이스 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3308/sns_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: sns-app
    password: 'Sns1234!'
  # 데이터베이스 초기화 설정 (애플리케이션 구동 시 schema.sql 및 data.sql 자동 실행)
  sql:
    init:
      mode: always

# MyBatis 설정
mybatis:
  # 매퍼 XML 파일 경로 매핑
  mapper-locations: classpath:mapper/**/*.xml
  # DTO 패키지 별칭 지정 (매퍼 XML에서 패키지명 생략 가능)
  type-aliases-package: net.likelion.bebc25.sns.dto
  configuration:
    # DB 컬럼명 스네이크 케이스를 자바 카멜 케이스 필드로 자동 변환
    map-underscore-to-camel-case: true
    # 쿼리 실행 로그 콘솔 출력 (개발/테스트 디버깅용)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Springdoc OpenAPI 및 Swagger UI 설정
springdoc:
  swagger-ui:
    # Swagger UI 엔드포인트 커스텀 경로 설정
    path: /swagger-ui.html
    # API 정렬 기준 (알파벳, HTTP 메서드 순)
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    # OpenAPI 문서 자동 생성 활성화 및 엔드포인트 경로
    enabled: true
    path: /v3/api-docs

jwt:
  # Base64로 인코딩된 최소 256비트(32바이트) 이상의 보안 비밀키
  secret: dGhpc2lzbXlzZWNyZXRrZXlmb3Jqd3R0b2tlbnNpZ25hdHVyZXZhbGlkYXRpb24xMjM0NTY3ODkwIQ==
  access-token-expiration: 3600000      # 1시간 (밀리초 단위)
  refresh-token-expiration: 604800000   # 7일 (밀리초 단위)